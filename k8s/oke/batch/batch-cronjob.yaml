apiVersion: batch/v1
kind: CronJob
metadata:
  name: train-daily-schedule
  namespace: batch
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: raillo-batch
        spec:
          restartPolicy: Never
          nodeSelector:
            raillo-node: data
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: raillo-batch
              image: ghcr.io/penggu-dev/raillo-batch:latest
              args:
                - --job=trainDailySchedule
              envFrom:
                - configMapRef:
                    name: raillo-config
                - secretRef:
                    name: raillo-secrets
              env:
                - name: JDK_JAVA_OPTIONS
                  value: -XX:MaxRAMPercentage=75.0
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 2Gi

