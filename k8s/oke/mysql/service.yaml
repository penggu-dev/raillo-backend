# StatefulSet용
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

---
# 애플리케이션 내부 접속용
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

---
# Jump Host 접속용
apiVersion: v1
kind: Service
metadata:
  name: mysql-admin
  namespace: mysql
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: mysql
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: mysql
      nodePort: 30060
