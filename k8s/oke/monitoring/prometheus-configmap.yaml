apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total
          - source_labels: [pod]
            action: drop
            regex: ''

      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: raillo-api
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [api-server]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: raillo-api
          # 관리 포트. actuator 엔드포인트는 메인 커넥터가 아니라 management.server.port에서 노출.
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8081"
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          # 알림 본문에 어느 파드인지 남기려면 이 라벨이 필요하다. instance는 파드 IP라 읽기 어렵다.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: valkey
        static_configs:
          - targets: ['valkey-exporter.monitoring.svc.cluster.local:9121']
            labels:
              namespace: valkey

      - job_name: mysql
        static_configs:
          - targets: ['mysql-exporter.monitoring.svc.cluster.local:9104']
