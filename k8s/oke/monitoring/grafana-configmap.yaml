apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    # 이름이 같고 uid가 다른 데이터소스가 Grafana DB에 있으면 갱신이 "data source not found"로 실패하고,
    # 프로비저닝 모듈 실패는 프로세스를 종료시킨다. uid는 갱신으로 바꿀 수 없으므로 지우고 다시 만든다.
    # Grafana가 datasources보다 먼저 처리하며, 재시작마다 반복해도 결과가 같다.
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        # 알림 규칙이 datasourceUid로 참조하므로 생성되는 값에 맡기지 않고 고정한다.
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: raillo
        folder: Raillo
        type: file
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /etc/grafana/
