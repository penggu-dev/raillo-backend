apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # 알림 규칙이 datasourceUid로 참조하므로 생성되는 값에 맡기지 않고 고정한다.
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: raillo
        folder: Raillo
        type: file
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /etc/grafana/
