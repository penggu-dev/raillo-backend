# Grafana가 grafana-dashboard-provider 설정으로 읽는 대시보드 JSON
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  raillo-resources.json: |
    {
      "uid": "raillo-resources",
      "title": "Raillo k8s node",
      "tags": [
        "raillo",
        "kubernetes"
      ],
      "timezone": "browser",
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "데이터소스",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          },
          {
            "name": "node",
            "label": "노드",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(kube_node_status_allocatable, node)",
            "query": {
              "query": "label_values(kube_node_status_allocatable, node)",
              "refId": "node"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "노드 할당 (request 기준, 스케줄 여유)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": []
        },
        {
          "type": "bargauge",
          "id": 1,
          "title": "CPU request 할당률",
          "description": "노드 allocatable 대비 Running·Pending 파드의 CPU request 합. 스케줄러는 이 값으로 새 파드 배치를 결정한다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{phase=~\"Pending|Running\"})) / sum by (node) (kube_node_status_allocatable{resource=\"cpu\"})",
              "legendFormat": "{{node}}",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "bargauge",
          "id": 2,
          "title": "메모리 request 할당률",
          "description": "노드 allocatable 대비 Running·Pending 파드의 메모리 request 합.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{phase=~\"Pending|Running\"})) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"})",
              "legendFormat": "{{node}}",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "CPU request 여유 (millicores)",
          "description": "새 파드가 요청할 수 있는 CPU. V1·V2 API는 각각 1000m이 필요하다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}) - sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{phase=~\"Pending|Running\"}))) * 1000",
              "legendFormat": "{{node}}",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:m",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "row",
          "title": "노드 실사용",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "id": 101,
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 4,
          "title": "노드 CPU 사용률",
          "description": "node-exporter 기준 실제 사용률. request 할당률과 달리 부하에 따라 움직인다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\", node=~\"$node\"}[$__rate_interval]))",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ],
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "노드 메모리 사용률",
          "description": "node-exporter 기준 MemAvailable을 뺀 사용률.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - node_memory_MemAvailable_bytes{node=~\"$node\"} / node_memory_MemTotal_bytes{node=~\"$node\"}",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ],
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "파드 자원 (cAdvisor)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 102,
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "파드 CPU 사용량 (cores)",
          "description": "컨테이너 CPU 사용 시간 증가율. 1.0이 CPU 1개를 다 쓴 상태다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\", node=~\"$node\"}[$__rate_interval]))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ],
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "파드 CPU 사용량 / limit",
          "description": "CPU limit 대비 사용률. 100%에 붙어 있으면 limit에서 막혀 throttling이 생긴다. limit 없는 파드는 표시되지 않는다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\", node=~\"$node\"}[$__rate_interval])) / sum by (namespace, pod) (kube_pod_container_resource_limits{resource=\"cpu\"})",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ],
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "파드 CPU throttling 비율",
          "description": "CFS 주기 중 limit에 걸려 멈춘 주기의 비율. 부하테스트 중 API가 1 CPU 제한에 걸리는지 확인한다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container!=\"\", node=~\"$node\"}[$__rate_interval])) / sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container!=\"\", node=~\"$node\"}[$__rate_interval]))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ],
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "파드 메모리 (working set)",
          "description": "OOM 판단 기준이 되는 working set 메모리.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\", node=~\"$node\"})",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "max",
                "lastNotNull"
              ],
              "sortBy": "Max",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "파드 할당 목록",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 33
          },
          "id": 103,
          "panels": []
        },
        {
          "type": "table",
          "id": 10,
          "title": "파드별 request·limit",
          "description": "노드별로 어떤 파드가 자원을 예약했는지 본다. limit이 비어 있으면 제한이 없는 파드다.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node, namespace, pod) (kube_pod_container_resource_requests{resource=\"cpu\", node=~\"$node\"}) * 1000",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node, namespace, pod) (kube_pod_container_resource_limits{resource=\"cpu\", node=~\"$node\"}) * 1000",
              "legendFormat": "",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node, namespace, pod) (kube_pod_container_resource_requests{resource=\"memory\", node=~\"$node\"})",
              "legendFormat": "",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node, namespace, pod) (kube_pod_container_resource_limits{resource=\"memory\", node=~\"$node\"})",
              "legendFormat": "",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "node": 0,
                  "namespace": 1,
                  "pod": 2,
                  "Value #A": 3,
                  "Value #B": 4,
                  "Value #C": 5,
                  "Value #D": 6
                },
                "renameByName": {
                  "node": "노드",
                  "namespace": "네임스페이스",
                  "pod": "파드",
                  "Value #A": "CPU request",
                  "Value #B": "CPU limit",
                  "Value #C": "메모리 request",
                  "Value #D": "메모리 limit"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU request"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "suffix:m"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU limit"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "suffix:m"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "메모리 request"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "메모리 limit"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "CPU request",
                "desc": true
              }
            ]
          }
        }
      ]
    }
