apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: raillo-issuer
spec:
  acme:
    email: railloservice@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: raillo-issuer
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
