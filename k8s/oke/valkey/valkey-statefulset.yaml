apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: valkey
spec:
  serviceName: valkey-headless
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      # raillo-valkey=true label이 있는 Worker에만 배치
      nodeSelector:
        raillo-valkey: "true"
      # hostPath 디렉터리를 valkey 사용자(999:1000)가 쓸 수 있도록 권한 설정
      initContainers:
        - name: init-valkey-data
          image: docker.io/library/busybox:1.36.1
          command:
            - sh
            - -c
            - chown -R 999:1000 /data
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.0-alpine
          # command가 이미지 entrypoint를 대체하므로 사용자 전환을 직접 지정
          securityContext:
            runAsUser: 999
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              exec valkey-server \
                --dir /data \
                --requirepass "$REDIS_PASSWORD" \
                --appendonly yes \
                --appendfsync everysec \
                --save '' \
                --maxmemory 5gb \
                --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: REDIS_PASSWORD
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          # AOF 로딩 중에는 PING이 LOADING을 반환하므로 PONG일 때까지 최대 10분 대기
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '[ "$(valkey-cli -a "$REDIS_PASSWORD" --no-auth-warning ping)" = "PONG" ]'
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 6Gi
            limits:
              cpu: 500m
              memory: 6Gi
      volumes:
        - name: valkey-data
          hostPath:
            path: /var/lib/raillo/valkey
            type: DirectoryOrCreate
