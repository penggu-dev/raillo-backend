# StatefulSet용
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: valkey
spec:
  clusterIP: None
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey

---
# 애플리케이션 내부 접속용
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: valkey
spec:
  type: ClusterIP
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
