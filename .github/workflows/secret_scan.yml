name: Secret Scan

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

# .githooks/pre-commit 의 MIN_VERSION 과 같은 값을 쓴다.
env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 히스토리 전체를 스캔하므로 shallow clone 을 쓰지 않는다.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # 체크섬 목록이 원본 파일명으로 적혀 있으므로 그 이름으로 받는다.
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # 보안 게이트 자체를 무검증 다운로드로 설치하지 않는다.
          grep -F " ${archive}" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Reject fingerprint-based suppression
        run: |
          set -euo pipefail
          # .gitleaksignore 는 커밋 해시에 묶여 있어 히스토리 재작성으로 억제가 풀린다.
          if [ -e .gitleaksignore ]; then
            echo "::error file=.gitleaksignore::.gitleaksignore 는 쓰지 않습니다. .gitleaks.toml allowlist 를 쓰세요."
            exit 1
          fi

      - name: Scan repository history
        run: |
          gitleaks git --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
