plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    group = 'com.sudo'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.0"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // QueryDSL — raillo-common(BaseEntity)와 raillo-core(도메인 엔티티) 모두 Q 클래스 생성이 필요해 subprojects로 통합.
        // 향후 JPA 엔티티 없는 모듈이 추가되면 해당 모듈은 아무 것도 생성하지 않으므로 부작용 없음.
        implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
        annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
        annotationProcessor "jakarta.annotation:jakarta.annotation-api"
        annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    }

    def querydslSrcDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

    sourceSets {
        main.java.srcDirs += [querydslSrcDir]
    }

    tasks.withType(JavaCompile) {
        options.getGeneratedSourceOutputDirectory().set(file(querydslSrcDir))
    }

    clean {
        delete file(querydslSrcDir)
    }

    test {
        useJUnitPlatform()
    }
}
