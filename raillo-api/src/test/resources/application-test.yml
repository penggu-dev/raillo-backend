spring:
  config.activate.on-profile: "test"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
    open-in-view: false

  mail:
    host: localhost
    port: 3025
    username: testUser
    password: testPassword
    test-connection: false # 테스트 시 메일 연결 확인 비활성화
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.jdbc.core: INFO
    io.lettuce.core: WARN

jwt:
  secret: "railotestjwtsecretkey2026fordevelopmentandtestingonlylonglonglonglonglonglonglonglonglong"

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET, POST, PUT, DELETE
  allowed-headers: Access-Control-Allow-Origin, Content-type, Access-Control-Allow-Headers, Authorization, X-Requested-With

cookie:
  domain: .test

payment:
  toss:
    api:
      base-url: https://api.tosspayments.com
      client-key: test_ck_stub
      secret-key: test_sk_stub
      version: v1
      connect-timeout: 1s
      read-timeout: 3s

raillo:
  payment:
    outbox:
      enabled: false
      polling-interval: 500ms
      batch-size: 10
      initial-backoff: 100ms
      max-backoff: 1s
      max-retries: 3

# redis TTL
redis:
  ttl:
    reservation: 10m
