resilience4j:
  circuitbreaker:
    configs:
      toss:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exception-predicate: com.sudo.raillo.payment.adapter.integration.toss.DefinitiveFailurePredicate
    instances:
      toss-confirm:
        base-config: toss
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
      toss-query-user:
        base-config: toss
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        slow-call-duration-threshold: 3s
      toss-query-worker:
        base-config: toss
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 5

server:
  tomcat:
    # 이것이 false면 tomcat_threads_* 지표가 등록되지 않아 스레드 포화 알림이 무효가 된다.
    mbeanregistry:
      enabled: true
    threads:
      max: ${TOMCAT_THREADS_MAX:200}

spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:.env[.properties]

  docker:
    compose:
      lifecycle-management: start_only

  jackson:
    time-zone: Asia/Seoul

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PW}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        order_inserts: true
        format_sql: true
        jdbc:
          batch_size: 500

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET, POST, PUT, DELETE
  allowed-headers: Access-Control-Allow-Origin, Content-type, Access-Control-Allow-Headers, Authorization, X-Requested-With

jwt:
  secret: ${JWT_KEY}

cookie:
  domain: localhost

payment:
  toss:
    api:
      base-url: https://api.tosspayments.com
      client-key: ${TOSS_CLIENT_KEY}
      secret-key: ${TOSS_SECRET_KEY}
      version: v1
      connect-timeout: 3s
      read-timeout: 15s          # confirm. 응답을 못 받으면 결과 불명이라 길게 둔다
      query-read-timeout: 5s     # query는 멱등이라 짧게 끊어도 다시 조회하면 된다
      connection-request-timeout: 2s
      query-budget: 10s
      query-max-attempts: 3
      query-backoff-base: 200ms
      max-connections-per-route: 100
      max-total: 200
      keep-alive-duration: 60s
      evict-idle-after: 30s
      worker:
        query-budget: 20s
        query-read-timeout: 10s

raillo:
  payment:
    outbox:
      enabled: true
      polling-interval: 5s
      batch-size: 50
      initial-backoff: 30s
      max-backoff: 10m
      max-retries: 5
    recovery:
      enabled: false
      polling-interval: 30s
      stale-after: 2m
      batch-size: 20
      lease-duration: 5m
      initial-backoff: 1m
      max-backoff: 30m
      max-wait: 24h

# Prometheus
management:
  # 관리 엔드포인트 전용 포트. 포트와 프로브 설계는 docs/infra/README.md 참고.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: raillo-backend
  endpoint:
    health:
      # liveness, readiness 그룹을 노출한다. 프로브가 종합 health를 보지 않게 하려는 것이다.
      probes:
        enabled: true
    prometheus:
      access: unrestricted

# redis TTL
redis:
  ttl:
    reservation: 10m
